# Optional Streamlit Cloud Secrets overrides for the two portal accounts.
# Store only SHA-256 digests here; never commit a secrets.toml or passwords.
# After changing a digest, that account's saved browser cookie cannot restore a session.

JOVI_ADMIN_USERNAME = "Matheus"
JOVI_ADMIN_PASSWORD_SHA256 = "<administrator password SHA-256 hex>"
JOVI_STANDARD_USERNAME = "jovi"
JOVI_STANDARD_PASSWORD_SHA256 = "<standard-user password SHA-256 hex>"
JOVI_AUTH_COOKIE_SECRET = "<long random signing secret>"
